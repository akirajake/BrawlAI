<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BrawlAI 1.1</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        #chat-history {
            scroll-behavior: smooth;
        }
        ::-webkit-scrollbar {
            width: 8px;
        }
        ::-webkit-scrollbar-track {
            background: #f1f1f1; 
        }
        ::-webkit-scrollbar-thumb {
            background: #cbd5e1; 
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #94a3b8; 
        }
        .message-content strong {
            font-weight: 600;
            color: #1f2937;
        }
        .message-content a {
            color: #2563eb;
            text-decoration: underline;
        }
    </style>
</head>
<body class="bg-gray-50 h-screen flex flex-col font-sans text-gray-800">

    <!-- ヘッダー -->
    <header class="bg-white border-b border-gray-200 px-6 py-4 flex justify-between items-center shadow-sm z-10">
        <div class="flex items-center space-x-3">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6 text-gray-700" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                <path stroke-linecap="round" stroke-linejoin="round" d="M19.428 15.428a2 2 0 00-1.022-.547l-2.387-.477a6 6 0 00-3.86.517l-.318.158a6 6 0 01-3.86.517L6.05 15.21a2 2 0 00-1.806.547M8 4h8l-1 1v5.172a2 2 0 00.586 1.414l5 5c1.26 1.26.367 3.414-1.415 3.414H4.828c-1.782 0-2.674-2.154-1.414-3.414l5-5A2 2 0 009 10.172V5L8 4z" />
            </svg>
            <h1 class="text-lg font-bold text-gray-800 tracking-wide">ブロスタ専用AI (最新情報対応版)</h1>
        </div>
        <button id="settings-btn" class="text-sm font-medium text-gray-500 hover:text-gray-900 flex items-center space-x-1 transition-colors">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                <path stroke-linecap="round" stroke-linejoin="round" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z" />
                <path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
            </svg>
            <span>設定</span>
        </button>
    </header>

    <!-- チャット表示領域 -->
    <main id="chat-history" class="flex-1 overflow-y-auto p-4 sm:p-6 space-y-6">
        <!-- メッセージはここにJavaScriptで追加されます -->
    </main>

    <!-- 入力領域 -->
    <footer class="bg-white border-t border-gray-200 p-4">
        <div class="max-w-4xl mx-auto flex items-end space-x-3">
            <textarea
                id="chat-input"
                placeholder="質問を入力（例: 最新キャラの性能は？ / 今の環境で強いのは？）"
                class="flex-1 bg-gray-50 border border-gray-300 rounded-lg px-4 py-3 focus:outline-none focus:border-gray-500 focus:ring-1 focus:ring-gray-500 resize-none min-h-[50px] max-h-[150px] text-sm"
                rows="1"
            ></textarea>
            <button
                id="send-btn"
                class="flex-shrink-0 bg-gray-800 text-white p-3 rounded-lg hover:bg-gray-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-gray-800 disabled:opacity-50 disabled:cursor-not-allowed transition-colors flex items-center justify-center h-[50px] w-[50px]"
            >
                <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 ml-1" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M12 19l9 2-9-18-9 18 9-2zm0 0v-8" />
                </svg>
            </button>
        </div>
    </footer>

    <!-- 設定モーダル -->
    <div id="settings-modal" class="hidden fixed inset-0 bg-gray-900 bg-opacity-60 flex items-center justify-center z-50 p-4 backdrop-blur-sm transition-opacity">
        <div class="bg-white rounded-xl shadow-2xl w-full max-w-md overflow-hidden">
            <div class="px-6 py-4 border-b border-gray-100 flex justify-between items-center bg-gray-50">
                <h2 class="text-lg font-bold text-gray-800">API・モデル設定</h2>
                <button id="close-modal-btn" class="text-gray-400 hover:text-gray-600 transition-colors">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
                    </svg>
                </button>
            </div>
            
            <div class="p-6 space-y-5">
                <div>
                    <label class="block text-sm font-semibold text-gray-700 mb-2">Google AI Studio APIキー</label>
                    <div class="flex space-x-2">
                        <input type="password" id="api-key-input" class="flex-1 border border-gray-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:border-gray-500 font-mono" placeholder="AIzaSy...">
                        <button id="fetch-models-btn" class="bg-gray-100 text-gray-700 px-3 py-2 border border-gray-300 rounded-lg text-sm font-medium hover:bg-gray-200 transition-colors whitespace-nowrap disabled:opacity-50">
                            モデル取得
                        </button>
                    </div>
                </div>

                <div>
                    <label class="block text-sm font-semibold text-gray-700 mb-2">使用するモデル</label>
                    <select id="model-select" class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:border-gray-500 bg-white">
                        <option value="">APIキーを入力して取得してください</option>
                    </select>
                    <p class="text-xs text-gray-500 mt-2">※Web検索機能を使うため、<b>gemini-1.5-pro</b> または <b>gemini-2.5-flash</b> 系を推奨します。</p>
                </div>
            </div>

            <div class="px-6 py-4 border-t border-gray-100 bg-gray-50 flex justify-between items-center">
                <button id="clear-settings-btn" class="text-sm text-red-600 hover:text-red-800 font-medium px-2 py-1 rounded transition-colors">
                    設定を削除
                </button>
                <button id="save-settings-btn" class="bg-gray-800 text-white px-5 py-2 rounded-lg text-sm font-medium hover:bg-gray-700 transition-colors shadow-sm">
                    保存して閉じる
                </button>
            </div>
        </div>
    </div>

    <script>
        let currentApiKey = localStorage.getItem('brawl_ai_api_key') || '';
        let currentModel = localStorage.getItem('brawl_ai_model') || '';
        let chatMessages = [
            { 
                role: 'model', 
                text: 'ブロスタ専用AIです。\nGoogle検索と連携し、最新のキャラクター情報や現在のメタ環境についても回答できるようになりました。知りたいことをご質問ください。' 
            }
        ];
        let isLoading = false;

        const dom = {
            history: document.getElementById('chat-history'),
            input: document.getElementById('chat-input'),
            sendBtn: document.getElementById('send-btn'),
            settingsBtn: document.getElementById('settings-btn'),
            modal: document.getElementById('settings-modal'),
            apiKeyInput: document.getElementById('api-key-input'),
            modelSelect: document.getElementById('model-select'),
            fetchModelsBtn: document.getElementById('fetch-models-btn'),
            saveBtn: document.getElementById('save-settings-btn'),
            clearBtn: document.getElementById('clear-settings-btn'),
            closeBtn: document.getElementById('close-modal-btn')
        };

        function init() {
            renderMessages();
            if (currentApiKey) {
                dom.apiKeyInput.value = currentApiKey;
                fetchModelsSilently(currentApiKey);
            }
        }

        function renderMessages() {
            dom.history.innerHTML = '';
            chatMessages.forEach(msg => {
                const isUser = msg.role === 'user';
                const wrapper = document.createElement('div');
                wrapper.className = `flex ${isUser ? 'justify-end' : 'justify-start'}`;

                const inner = document.createElement('div');
                inner.className = `flex max-w-[90%] sm:max-w-[80%] ${isUser ? 'flex-row-reverse' : 'flex-row'}`;

                const iconDiv = document.createElement('div');
                iconDiv.className = `flex-shrink-0 flex items-center justify-center w-8 h-8 rounded-full mt-1 ${isUser ? 'bg-gray-600 ml-3' : 'bg-gray-200 mr-3'}`;
                iconDiv.innerHTML = isUser 
                    ? `<svg class="w-5 h-5 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path></svg>`
                    : `<svg class="w-5 h-5 text-gray-700" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9.75 17L9 20l-1 1h8l-1-1-.75-3M3 13h18M5 17h14a2 2 0 002-2V5a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"></path></svg>`;

                const bubble = document.createElement('div');
                bubble.className = `px-4 py-3 rounded-2xl text-sm leading-relaxed message-content ${
                    isUser 
                        ? 'bg-gray-800 text-white rounded-tr-none' 
                        : 'bg-white text-gray-800 border border-gray-200 rounded-tl-none shadow-sm'
                }`;
                bubble.innerHTML = formatText(msg.text);

                // もしグラウンディング（検索元）情報があれば追加
                if (msg.sources && msg.sources.length > 0) {
                    const sourceDiv = document.createElement('div');
                    sourceDiv.className = "mt-3 pt-2 border-t border-gray-100 text-xs text-gray-500";
                    sourceDiv.innerHTML = "<b>参考リンク:</b><br>";
                    msg.sources.forEach(src => {
                        if(src.uri && src.title) {
                            sourceDiv.innerHTML += `<a href="${src.uri}" target="_blank" class="block truncate hover:text-blue-600 mb-1">・${src.title}</a>`;
                        }
                    });
                    bubble.appendChild(sourceDiv);
                }

                inner.appendChild(iconDiv);
                inner.appendChild(bubble);
                wrapper.appendChild(inner);
                dom.history.appendChild(wrapper);
            });
            scrollToBottom();
        }

        function renderLoading() {
            const wrapper = document.createElement('div');
            wrapper.id = 'loading-indicator';
            wrapper.className = 'flex justify-start';
            wrapper.innerHTML = `
                <div class="flex flex-row max-w-[85%]">
                    <div class="flex-shrink-0 flex items-center justify-center w-8 h-8 rounded-full mt-1 bg-gray-200 mr-3">
                        <svg class="w-5 h-5 text-gray-700" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9.75 17L9 20l-1 1h8l-1-1-.75-3M3 13h18M5 17h14a2 2 0 002-2V5a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"></path></svg>
                    </div>
                    <div class="px-4 py-3 rounded-2xl bg-white border border-gray-200 rounded-tl-none shadow-sm flex items-center space-x-2">
                        <div class="w-2 h-2 bg-gray-400 rounded-full animate-bounce"></div>
                        <div class="w-2 h-2 bg-gray-400 rounded-full animate-bounce" style="animation-delay: 0.2s"></div>
                        <div class="w-2 h-2 bg-gray-400 rounded-full animate-bounce" style="animation-delay: 0.4s"></div>
                        <span class="text-xs text-gray-400 ml-2">最新情報を検索中...</span>
                    </div>
                </div>
            `;
            dom.history.appendChild(wrapper);
            scrollToBottom();
        }

        function removeLoading() {
            const el = document.getElementById('loading-indicator');
            if (el) el.remove();
        }

        function formatText(text) {
            let html = text.replace(/</g, '&lt;').replace(/>/g, '&gt;');
            html = html.replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>');
            html = html.replace(/\n/g, '<br>');
            return html;
        }

        function scrollToBottom() {
            dom.history.scrollTop = dom.history.scrollHeight;
        }

        dom.settingsBtn.addEventListener('click', () => {
            dom.modal.classList.remove('hidden');
        });
        dom.closeBtn.addEventListener('click', () => {
            dom.modal.classList.add('hidden');
        });

        async function fetchModelsSilently(key) {
            try {
                const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models?key=${key}`);
                if (!res.ok) return;
                const data = await res.json();
                updateModelSelect(data.models);
            } catch (e) {
                console.error(e);
            }
        }

        dom.fetchModelsBtn.addEventListener('click', async () => {
            const key = dom.apiKeyInput.value.trim();
            if (!key) {
                alert('APIキーを入力してください。');
                return;
            }
            dom.fetchModelsBtn.disabled = true;
            dom.fetchModelsBtn.textContent = '取得中...';
            
            try {
                const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models?key=${key}`);
                if (!res.ok) throw new Error('APIキーが無効、または通信エラーです。');
                const data = await res.json();
                
                updateModelSelect(data.models);
                alert('モデル一覧を取得しました。使用するモデルを選択して保存してください。');
            } catch (e) {
                alert(e.message);
            } finally {
                dom.fetchModelsBtn.disabled = false;
                dom.fetchModelsBtn.textContent = 'モデル取得';
            }
        });

        function updateModelSelect(models) {
            dom.modelSelect.innerHTML = '';
            const validModels = models.filter(m => 
                m.name.includes('gemini') && 
                m.supportedGenerationMethods && 
                m.supportedGenerationMethods.includes('generateContent')
            );

            if(validModels.length === 0) {
                dom.modelSelect.innerHTML = '<option value="">利用可能なモデルが見つかりません</option>';
                return;
            }

            validModels.forEach(m => {
                const option = document.createElement('option');
                option.value = m.name;
                option.textContent = m.displayName || m.name;
                dom.modelSelect.appendChild(option);
            });

            if (currentModel && Array.from(dom.modelSelect.options).some(o => o.value === currentModel)) {
                dom.modelSelect.value = currentModel;
            }
        }

        dom.saveBtn.addEventListener('click', () => {
            const key = dom.apiKeyInput.value.trim();
            const model = dom.modelSelect.value;
            
            if (!key) {
                alert('APIキーを入力してください。');
                return;
            }
            if (!model) {
                alert('モデルを取得・選択してください。');
                return;
            }

            currentApiKey = key;
            currentModel = model;
            localStorage.setItem('brawl_ai_api_key', currentApiKey);
            localStorage.setItem('brawl_ai_model', currentModel);
            dom.modal.classList.add('hidden');
        });

        dom.clearBtn.addEventListener('click', () => {
            if (confirm('保存されているAPIキーと設定をブラウザから削除しますか？')) {
                currentApiKey = '';
                currentModel = '';
                localStorage.removeItem('brawl_ai_api_key');
                localStorage.removeItem('brawl_ai_model');
                dom.apiKeyInput.value = '';
                dom.modelSelect.innerHTML = '<option value="">APIキーを入力して取得してください</option>';
                alert('設定を削除しました。');
            }
        });

        async function handleSend() {
            const text = dom.input.value.trim();
            if (!text || isLoading) return;

            if (!currentApiKey || !currentModel) {
                alert('右上の「設定」からAPIキーとモデルを設定してください。');
                dom.modal.classList.remove('hidden');
                return;
            }

            chatMessages.push({ role: 'user', text: text });
            dom.input.value = '';
            dom.input.style.height = 'auto';
            renderMessages();
            
            isLoading = true;
            dom.sendBtn.disabled = true;
            renderLoading();

            // システムプロンプトを大幅に強化し、検索の必要性を指示
            const systemPrompt = `あなたはスーパーセルが配信するスマホゲーム『ブロスタ（Brawl Stars）』に特化した専用AIアシスタントです。
以下のルールに厳格に従ってユーザーと会話してください。

【重要：最新情報の検索】
1. あなたの知識は過去のものである可能性があります。新キャラクター、最新のハイパーチャージ、バランス調整、海外版先行キャラクターなどの質問が来た場合は、必ず組み込まれているGoogle検索ツールを使用して最新の情報を調べてから回答してください。
2. ユーザーが「シリウス」などの新しいキャラクター、あるいは知らない用語を出した場合は、自分の知識で「存在しない」と決めつけず、まず「Brawl Stars [キャラクター名]」などでWeb検索を行って事実確認をしてください。

【行動ルール】
1. 専門性: ブロスタに関する質問に的確かつ実践的なアドバイスを提供してください。
2. 世界観の維持: ブロスタ以外の話題を振られた場合は絶対に答えないでください。「申し訳ありませんが、ブロスタ以外の質問にはお答えできません。」と丁寧に断ってください。
3. トーン＆マナー: 丁寧で落ち着いたトーンで回答してください。絵文字は一切使用しないでください。
4. 構成: 読みやすくするために箇条書きや改行をうまく使ってください。`;

            try {
                const historyForApi = chatMessages.slice(1).map(msg => ({
                    role: msg.role === 'model' ? 'model' : 'user',
                    parts: [{ text: msg.text }]
                }));

                const payload = {
                    contents: historyForApi,
                    systemInstruction: { parts: [{ text: systemPrompt }] },
                    // 【追加】Google検索によるグラウンディングを有効化
                    tools: [{ "googleSearch": {} }]
                };

                const url = `https://generativelanguage.googleapis.com/v1beta/${currentModel}:generateContent?key=${currentApiKey}`;

                const response = await fetch(url, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });

                if (!response.ok) {
                    const errorData = await response.json().catch(() => ({}));
                    
                    // 古いモデル等でgoogleSearchツールがサポートされていない場合のエラーハンドリング
                    if(errorData.error?.message?.includes("googleSearch") || response.status === 400) {
                        throw new Error("選択したモデルはWeb検索連携に対応していません。設定からgemini-1.5-proやgemini-2.5-flash等の新しいモデルを選択してください。");
                    }
                    throw new Error(errorData.error?.message || `通信エラーが発生しました (${response.status})`);
                }

                const data = await response.json();
                const replyText = data.candidates?.[0]?.content?.parts?.[0]?.text || '返答を生成できませんでした。';
                
                // 検索ソース（参考リンク）の抽出
                let sources = [];
                const groundingMetadata = data.candidates?.[0]?.groundingMetadata;
                if (groundingMetadata && groundingMetadata.groundingChunks) {
                    groundingMetadata.groundingChunks.forEach(chunk => {
                        if (chunk.web && chunk.web.uri && chunk.web.title) {
                            // 重複を排除して追加
                            if(!sources.find(s => s.uri === chunk.web.uri)) {
                                sources.push({
                                    title: chunk.web.title,
                                    uri: chunk.web.uri
                                });
                            }
                        }
                    });
                }
                
                chatMessages.push({ 
                    role: 'model', 
                    text: replyText,
                    sources: sources
                });

            } catch (err) {
                console.error(err);
                chatMessages.push({ 
                    role: 'model', 
                    text: `エラーが発生しました。\n詳細: ${err.message}` 
                });
            } finally {
                isLoading = false;
                dom.sendBtn.disabled = false;
                removeLoading();
                renderMessages();
                dom.input.focus();
            }
        }

        dom.sendBtn.addEventListener('click', handleSend);
        
        dom.input.addEventListener('keydown', (e) => {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                handleSend();
            }
        });

        dom.input.addEventListener('input', function() {
            this.style.height = 'auto';
            this.style.height = (this.scrollHeight) + 'px';
        });

        init();
    </script>
</body>
</html>
